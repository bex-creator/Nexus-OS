name: Build Nexus OS Setup.exe

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js (On GitHub Server)
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Discord-Style Installer
      run: npm run build
      
    - name: Upload Setup.exe
      uses: actions/upload-artifact@v3
      with:
        name: NexusOS-Setup-Windows
        path: dist/*.exe
